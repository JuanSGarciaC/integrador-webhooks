        <p style="margin:0 0 12px;color:#93a1b8">Recibe webhooks de GitHub, comprueba su firma HMAC, los guarda y los entrega a otro servicio con reintentos (espera exponencial y jitter). Lo que no se puede entregar queda en una cola de fallidos para reprocesarlo.</p>
        <p style="margin:0 0 12px">Este panel necesita JavaScript para funcionar. Actívalo y recarga la página.</p>
        <p style="margin:0"><a style="color:#56d4ff" href="https://github.com/JuanSGarciaC/integrador-webhooks#readme">Leer el README del proyecto en GitHub</a></p>
