name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest --cov=app --cov-report=term-missing
      - name: OpenAPI no cambió sin confirmarse
        run: python scripts/export_openapi.py --check ../docs/openapi.json

  contract:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r backend/requirements.txt
      - name: Levantar instancia de prueba
        working-directory: backend
        env:
          WEBHOOK_SECRET: newman-secret
          DATABASE_URL: sqlite:///./ci.db
        run: |
          nohup uvicorn app.main:app --port 8000 --log-level warning > ../api.log 2>&1 &
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break || sleep 1; done
      - name: Colección Postman con Newman
        run: npx --yes newman@6 run docs/postman/integrador.postman_collection.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
